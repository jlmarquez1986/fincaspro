[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

ignore = [
    "B008",
    "B904",
]

exclude = [
    "backend/alembic/versions",
]

[tool.ruff.lint.per-file-ignores]
# Los imports van tras os.environ.setdefault(...) a propósito: los módulos de
# la app leen variables de entorno al importarse (SECRET_KEY, etc.).
"backend/tests/conftest.py" = ["E402"]

# ------------------------------------------------------------------
# MyPy — Configuración profesional para SQLAlchemy 2.0
# ------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "backend"

follow_imports = "normal"
ignore_missing_imports = true

check_untyped_defs = true
strict_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true

exclude = [
    "^backend/alembic/",
    "^backend/tests/",
    "^alembic/",
    "^tests/",
    "^venv/",
    "^\\.venv/",
]

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bcrypt"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "slowapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiosmtplib"
ignore_missing_imports = true

# ------------------------------------------------------------------
# Pyright — Configuración para Pylance / VS Code
# ------------------------------------------------------------------
# Pyright es el motor de análisis estático que usa VS Code (Pylance).
# Aunque MyPy pase limpio, Pyright tiene reglas distintas.
# ------------------------------------------------------------------
[tool.pyright]
# Versión de Python objetivo
pythonVersion = "3.13"

# Modo de chequeo: "standard" es un buen equilibrio.
# Opciones: "off" | "basic" | "standard" | "strict"
typeCheckingMode = "standard"

# Rutas adicionales para resolver imports (equivalente a mypy_path)
# Esto permite que "from security import ..." se resuelva desde backend/
extraPaths = ["backend"]

# Incluir solo la carpeta backend
include = ["backend"]

# Excluir código generado, tests y entornos virtuales
exclude = [
    "**/alembic",
    "**/tests",
    "**/venv",
    "**/.venv",
]

# No reportar imports faltantes de librerías sin stubs.
# Esto evita que Pyright se queje de bcrypt, jose, slowapi, etc.
reportMissingImports = "warning"

# Desactivar reglas demasiado estrictas para un proyecto en evolución.
# Se pueden activar progresivamente.
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportMissingTypeStubs = false

# ------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

python_files = [
    "test_*.py"
]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]

# ------------------------------------------------------------------
# coverage
# ------------------------------------------------------------------
[tool.coverage.run]
source = ["backend"]

omit = [
    "*/tests/*",
    "*/alembic/*"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
