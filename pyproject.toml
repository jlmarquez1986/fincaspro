[tool.black]
line-length = 100
target-version = ["py312"]


# ------------------------------------------------------------------
# Ruff — Linter y formateador
# ------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

# Hace que las exclusiones se respeten incluso cuando se pasan
# rutas explícitas a Ruff.
force-exclude = true

# Migraciones autogeneradas por Alembic.
# No se modifican para satisfacer el linter porque forman parte
# del historial de cambios de la base de datos.
exclude = [
    "backend/alembic/versions",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "B008",
    "B904",
]


[tool.ruff.lint.per-file-ignores]

# Los imports van después de os.environ.setdefault(...) a propósito:
# los módulos de la aplicación leen variables de entorno al importarse
# (SECRET_KEY, etc.).

"backend/tests/conftest.py" = ["E402"]


# ------------------------------------------------------------------
# MyPy — Configuración profesional para SQLAlchemy 2.0
# ------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
mypy_path = "backend"

follow_imports = "normal"
ignore_missing_imports = true

check_untyped_defs = true
strict_optional = true

warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

show_error_codes = true
show_column_numbers = true

exclude = [
    "^backend/alembic/",
    "^backend/tests/",
    "^alembic/",
    "^tests/",
    "^venv/",
    "^\\.venv/",
]


[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "bcrypt"
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "slowapi.*"
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "aiosmtplib"
ignore_missing_imports = true


# ------------------------------------------------------------------
# Pyright — Configuración para Pylance / VS Code
# ------------------------------------------------------------------

# Pyright es el motor de análisis estático utilizado por VS Code
# mediante Pylance.

[tool.pyright]

# Versión de Python objetivo
pythonVersion = "3.13"

# Nivel de comprobación:
# off | basic | standard | strict
typeCheckingMode = "standard"

# Permite resolver imports desde backend/
extraPaths = [
    "backend",
]

# Analizar únicamente el backend
include = [
    "backend",
]

# Excluir código generado, tests y directorios que no necesitan
# análisis estático.
exclude = [
    "**/alembic",
    "**/tests",
    "**/venv",
    "**/.venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.git",
    "**/.*",
]

# No considerar como error los imports de librerías que no disponen
# de stubs completos.
reportMissingImports = "warning"

# Reglas de tipado que se irán endureciendo progresivamente.
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportMissingTypeStubs = false


# ------------------------------------------------------------------
# Pytest
# ------------------------------------------------------------------

[tool.pytest.ini_options]

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


# ------------------------------------------------------------------
# Coverage
# ------------------------------------------------------------------

[tool.coverage.run]

source = [
    "backend",
]

omit = [
    "*/tests/*",
    "*/alembic/*",
]


[tool.coverage.report]

show_missing = true
skip_covered = false