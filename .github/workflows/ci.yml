name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('backend/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install pyright

      - name: Run Ruff linter
        run: ruff check backend/

      - name: Run Ruff formatter check
        run: ruff format --check backend/

      - name: Run MyPy
        run: mypy backend/

      - name: Run Pyright
        run: pyright backend/

      - name: Validate Alembic migrations
        if: matrix.python-version == '3.13'
        working-directory: backend
        run: |
          rm -f ci_migration.db
          DATABASE_URL=sqlite:///./ci_migration.db alembic upgrade head
          DATABASE_URL=sqlite:///./ci_migration.db alembic check
          rm -f ci_migration.db

      - name: Run tests with coverage
        working-directory: backend
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v6
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  docker-production:
    name: Docker production
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate production Compose
        run: |
          cp .env.production.example .env.production
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-only-secret-key-not-for-production/' .env.production
          docker compose --env-file .env.production -f docker-compose.prod.yml config >/dev/null
          rm -f .env.production

      - name: Build backend image
        run: docker build --tag fincaspro-backend:ci ./backend

      - name: Build frontend production image
        run: docker build --tag fincaspro-frontend:ci ./frontend